---
- name: Create promtail directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ promtail_dir }}"
    - "{{ promtail_config_dir }}"
    - "{{ promtail_positions_dir }}"

- name: Render promtail config
  ansible.builtin.template:
    src: promtail-config.yml.j2
    dest: "{{ promtail_config_dir }}/promtail-config.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart promtail

- name: Render promtail docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ promtail_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart promtail

- name: Pull promtail image
  community.docker.docker_compose_v2:
    project_src: "{{ promtail_dir }}"
    files:
      - docker-compose.yml
    pull: always
    state: present

- name: Start promtail
  community.docker.docker_compose_v2:
    project_src: "{{ promtail_dir }}"
    files:
      - docker-compose.yml
    state: present
    recreate: auto

- name: Wait for Promtail to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:9080/ready"
    status_code: 200
  register: promtail_ready
  until: promtail_ready.status == 200
  retries: 30
  delay: 3
  changed_when: false 
---
prometheus_version: "v2.54.1"
prometheus_dir: /opt/prometheus
prometheus_data_dir: /opt/prometheus/data
prometheus_config_dir: /opt/prometheus/config
prometheus_docker_network: monitoring
prometheus_port: 9090
prometheus_retention: "15d"
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"

app_internal_ip: "10.0.0.23"

prometheus_external_labels:
  environment: production
  cluster: bulletins

prometheus_scrape_configs:
  - job_name: prometheus
    targets:
      - "prometheus:9090"
    metrics_path: /metrics
    scheme: http
    labels:
      service: prometheus

  - job_name: node
    targets:
      - "{{ app_internal_ip }}:9100"
    metrics_path: /metrics
    scheme: http
    labels:
      service: node-exporter
      host: bulletins-vm

  - job_name: spring-actuator
    targets:
      - "{{ app_internal_ip }}:9090"
    metrics_path: /actuator/prometheus
    scheme: http
    labels:
      service: bulletins-app
      host: bulletins-vm
---
- name: Configure application VM
  hosts: app
  become: true
  tags: [docker]
  roles:
    - docker

- name: Deploy bulletins application
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [deploy, app]
  roles:
    - deploy

- name: Setup nginx (HTTP only)
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [nginx]
  roles:
    - nginx

- name: Issue TLS certificate
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [certbot, tls]
  roles:
    - certbot

- name: Reconfigure nginx with TLS
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [nginx, tls]
  roles:
    - nginx

- name: Install application server agents
  hosts: app
  become: true
  tags: [agents]
  roles:
    - role: node_exporter
      tags: [node_exporter]
    - role: nginx_exporter
      tags: [nginx_exporter]
    - role: promtail
      tags: [promtail]

- name: Configure monitoring VM
  hosts: monitoring
  become: true
  tags: [docker]
  roles:
    - docker

- name: Install Prometheus
  hosts: monitoring
  become: true
  tags: [prometheus]
  roles:
    - prometheus

- name: Install Grafana
  hosts: monitoring
  become: true
  vars_files:
    - vault.yml
  tags: [grafana]
  roles:
    - grafana

- name: Install Loki
  hosts: monitoring
  become: true
  tags: [loki]
  roles:
    - loki

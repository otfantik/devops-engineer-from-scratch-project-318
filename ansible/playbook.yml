---
- name: Configure bulletins VM
  hosts: bulletins-vm
  become: true
  roles:
    - docker

- name: Deploy bulletins application
  hosts: bulletins-vm
  become: true
  vars_files:
    - vault.yml
  roles:
    - deploy

# HTTP only, needed for ACME challenge
- name: Setup nginx (HTTP only)
  hosts: bulletins-vm
  become: true
  vars_files:
    - vault.yml
  roles:
    - nginx

# Obtain TLS certificate
- name: Issue TLS certificate
  hosts: bulletins-vm
  become: true
  vars_files:
    - vault.yml
  roles:
    - certbot

# Re-render nginx with 443 block
- name: Reconfigure nginx with TLS
  hosts: bulletins-vm
  become: true
  vars_files:
    - vault.yml
  roles:
    - nginx

# Host-level metrics
- name: Install Prometheus Node Exporter
  hosts: bulletins-vm
  become: true
  tags: [node_exporter]
  roles:
    - node_exporter
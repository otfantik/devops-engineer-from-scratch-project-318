---
- name: Configure application VM
  hosts: app
  become: true
  tags: [docker]
  roles:
    - docker

- name: Deploy bulletins application
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [deploy, app]
  roles:
    - deploy

- name: Install nginx (official)
  hosts: app
  become: true
  tags: [nginx]
  roles:
    - role: nginxinc.nginx
      nginx_type: opensource
      nginx_install_from: nginx_repository
      nginx_setup: install
      nginx_start: true

- name: Apply nginx config (HTTP only, for ACME)
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [nginx]
  roles:
    - app_nginx

- name: Issue TLS certificate
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [certbot, tls]
  roles:
    - certbot

- name: Reconfigure nginx with TLS
  hosts: app
  become: true
  vars_files:
    - vault.yml
  tags: [nginx, tls]
  roles:
    - app_nginx

- name: Install application server agents
  hosts: app
  become: true
  tags: [agents]
  roles:
    - role: node_exporter
      tags: [node_exporter]
    - role: nginx_exporter
      tags: [nginx_exporter]
    - role: promtail
      tags: [promtail]

- name: Configure monitoring VM
  hosts: monitoring
  become: true
  tags: [docker]
  roles:
    - docker

- name: Install Prometheus
  hosts: monitoring
  become: true
  tags: [prometheus]
  roles:
    - prometheus

- name: Install Grafana
  hosts: monitoring
  become: true
  vars_files:
    - vault.yml
  tags: [grafana]
  roles:
    - grafana

- name: Install Loki
  hosts: monitoring
  become: true
  tags: [loki]
  roles:
    - loki